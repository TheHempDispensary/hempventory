name: Deploy Frontend to Netlify

on:
  push:
    branches: [main]
    paths:
      - "hemp-inventory-frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
        working-directory: hemp-inventory-frontend

      - run: npm run build
        working-directory: hemp-inventory-frontend

      - run: npx netlify-cli deploy --prod --dir=dist --site=${{ secrets.NETLIFY_SITE_ID }}
        working-directory: hemp-inventory-frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
